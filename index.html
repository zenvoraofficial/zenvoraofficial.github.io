
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071126">
  <title>ZENVORA | Technology Beyond Limits</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071126;
      color: white;
    }

    header {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #172b50;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(90deg, #00d9ff, #087cff, #a020f0);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero {
      min-height: 75vh;
      padding: 90px 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tag {
      color: #00d9ff;
      letter-spacing: 3px;
      font-size: 12px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 72px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    h1 span {
      background: linear-gradient(90deg, #00d9ff, #087cff, #a020f0);
      -webkit-background-clip: text;
      color: transparent;
    }

    .description {
      color: #a9b8d0;
      line-height: 1.8;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 30px;
      background: linear-gradient(90deg, #087cff, #9228e8);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 25px #087cff55;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #8091ad;
      border-top: 1px solid #172b50;
      font-size: 13px;
    } 
    
/* ZENVORA PREMIUM DESIGN UPGRADE */

html {
  scroll-behavior: smooth;
}

body {
  background:
    radial-gradient(
      circle at 50% 35%,
      #102653 0%,
      #071126 48%,
      #030712 100%
    );
  background-attachment: fixed;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5, 12, 29, 0.85);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(0, 217, 255, 0.15);
}

.hero {
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  background: #087cff;
  filter: blur(130px);
  opacity: 0.18;
  border-radius: 50%;
  top: 10%;
  left: -100px;
  pointer-events: none;
}

.hero::after {
  content: "";
  position: absolute;
  width: 240px;
  height: 240px;
  background: #9228e8;
  filter: blur(130px);
  opacity: 0.16;
  border-radius: 50%;
  bottom: 0;
  right: -100px;
  pointer-events: none;
}

.btn {
  transition: transform 0.3s, box-shadow 0.3s;
}

.btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 35px #087cff99;
}

footer {
  background: rgba(3, 7, 18, 0.7);
  border-top: 1px solid rgba(0, 217, 255, 0.15);
}

  </style>
</head>
<body>

  <header>
    <div class="logo">ZENVORA</div>
    <div>☰</div>
  </header>

  <main class="hero">
    <p class="tag">WELCOME TO THE FUTURE</p>

    <h1>Technology <span>Beyond Limits.</span></h1>

    <p class="description">
      Discover innovative technology,
      powerful applications and a smarter
      digital future with ZENVORA.
    </p>

    <a href="#about" class="btn">Explore ZENVORA</a>
  </main>

  <footer id="about">
    © 2026 ZENVORA Technologies.
    All Rights Reserved.
  </footer>

</body>
</html>
