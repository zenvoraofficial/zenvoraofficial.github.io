
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071126">
  <title>ZENVORA | Technology Beyond Limits</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071126;
      color: white;
    }

    header {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #172b50;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(90deg, #00d9ff, #087cff, #a020f0);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero {
      min-height: 75vh;
      padding: 90px 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .tag {
      color: #00d9ff;
      letter-spacing: 3px;
      font-size: 12px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 72px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    h1 span {
      background: linear-gradient(90deg, #00d9ff, #087cff, #a020f0);
      -webkit-background-clip: text;
      color: transparent;
    }

    .description {
      color: #a9b8d0;
      line-height: 1.8;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 30px;
      background: linear-gradient(90deg, #087cff, #9228e8);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 25px #087cff55;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #8091ad;
      border-top: 1px solid #172b50;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ZENVORA</div>
    <div>☰</div>
  </header>

  <main class="hero">
    <p class="tag">WELCOME TO THE FUTURE</p>

    <h1>Technology <span>Beyond Limits.</span></h1>

    <p class="description">
      Discover innovative technology,
      powerful applications and a smarter
      digital future with ZENVORA.
    </p>

    <a href="#about" class="btn">Explore ZENVORA</a>
  </main>

  <footer id="about">
    © 2026 ZENVORA Technologies.
    All Rights Reserved.
  </footer>

</body>
</html>
